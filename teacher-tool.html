<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선생님 도구 — 올인원 교사 업무 보조</title>
  <style>
    /* ═══ FONTS ═══ */
    @font-face {
      font-family: 'Binggrae';
      src: local('Binggrae Bold'), local('빙그레 Bold'), local('빙그레체 Bold');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    /* ═══ RESET + BASE ═══ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:      #FFD600;           /* vivid yellow — primary accent */
      --accent-dark: #B89A00;           /* darker yellow for text on light bg */
      --accent-text: #1A1A1A;           /* text on yellow background */
      --accent-mid:  rgba(255,214,0,0.16);
      --accent-soft: rgba(255,214,0,0.10);
      --ios-blue:   #007AFF;
      --ios-green:  #34C759;
      --ios-orange: #FF9500;
      --ios-red:    #FF3B30;
      --ios-purple: #AF52DE;
      --ios-teal:   #30B0C7;
      --ios-gray:   #8E8E93;
      --ios-gray2:  #AEAEB2;
      --ios-gray3:  #C7C7CC;
      --bg-page:    #F5F5F5;
      --bg-card:    #FFFFFF;
      --bg-sidebar: #FAFAFA;
      --bg-input:   rgba(0,0,0,0.05);
      --text-primary:   #1A1A1A;
      --text-secondary: #5A5A5A;
      --text-muted:     #9A9A9A;
      --border: rgba(0,0,0,0.11);
      --shadow-sm: 0 1px 3px rgba(55,53,47,0.08), 0 1px 2px rgba(55,53,47,0.05);
      --shadow-md: 0 4px 16px rgba(55,53,47,0.08), 0 1px 4px rgba(55,53,47,0.05);
      --shadow-lg: 0 8px 32px rgba(55,53,47,0.12), 0 2px 8px rgba(55,53,47,0.06);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: 0.2s ease;
      --sidebar-w: 226px;
      --font: 'HCGothicB', 'HCGothic', '한컴고딕', 'Malgun Gothic', sans-serif;
      --font-nav: 'Binggrae', 'Malgun Gothic', sans-serif;
    }
    body {
      font-family: var(--font); font-size: 18px; font-weight: 700;
      background: var(--bg-page); color: var(--text-primary);
      line-height: 1.6; -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ═══ LAYOUT ═══ */
    .tt-app { display: flex; min-height: 100vh; }

    /* ─── SIDEBAR ─── */
    .tt-sidebar {
      width: var(--sidebar-w); position: fixed; top: 0; left: 0;
      height: 100vh; background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 100; overflow-y: auto;
    }
    .tt-sidebar::-webkit-scrollbar { width: 4px; }
    .tt-sidebar::-webkit-scrollbar-thumb { background: var(--ios-gray3); border-radius: 2px; }

    /* ─── SIDEBAR PHOTO ─── */
    .tt-sidebar-photo-wrap { padding: 14px 14px 0; }
    .tt-sidebar-photo {
      width: 100%; aspect-ratio: 1/1;
      border-radius: var(--radius-md); overflow: hidden; cursor: pointer;
      background: var(--bg-page); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: border-color var(--transition);
    }
    .tt-sidebar-photo:hover { border-color: rgba(255,214,0,0.7); }
    .tt-sidebar-photo img  { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tt-sidebar-photo-ph   { font-size: 38px; user-select: none; }

    /* ─── SIDEBAR DATE NAV ─── */
    .tt-sidebar-date-wrap { padding:14px 10px 10px; border-bottom:1px solid var(--border); position:relative; }
    .tt-sidebar-date-row  { display:flex; align-items:center; gap:4px; }
    .tt-sidebar-date-pill {
      flex:1; text-align:center; padding:9px 4px; border-radius:var(--radius-sm);
      background:var(--bg-page); border:1.5px solid var(--border);
      cursor:pointer; user-select:none; font-size:16px; font-weight:700; line-height:1.4;
      transition:background var(--transition), border-color var(--transition);
    }
    .tt-sidebar-date-pill:hover { background:var(--accent-soft); border-color:rgba(255,214,0,0.6); }
    .tt-sidebar-date-pill .day-sub { font-size:13px; font-weight:400; color:var(--text-muted); display:block; }
    .tt-sidebar-today-btn {
      display:block; width:100%; margin-top:7px; padding:5px 0;
      text-align:center; font-size:14px; font-weight:700; color:var(--accent-text);
      border:none; background:var(--accent); cursor:pointer; font-family:var(--font);
      border-radius:var(--radius-sm); transition:filter var(--transition);
    }
    .tt-sidebar-today-btn:hover { filter:brightness(0.92); }

    .tt-nav { list-style: none; padding: 8px 0; flex: 1; }
    .tt-nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; margin: 2px 8px; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 17px; font-weight: 700;
      font-family: var(--font-nav);
      color: var(--text-secondary); user-select: none;
      transition: background var(--transition), color var(--transition);
    }
    .tt-nav-item:hover { background: rgba(0,0,0,0.05); }
    .tt-nav-item.active { background: var(--accent-mid); color: var(--accent-text); font-weight: 700; border-left: 3px solid var(--accent); margin-left: 5px; padding-left: 11px; }
    .tt-nav-icon { font-size: 21px; width: 26px; text-align: center; flex-shrink: 0; font-family: sans-serif; }
    .tt-sidebar-footer {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 4px;
    }
    .tt-clock { font-size: 25px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
    .tt-today-badge { font-size: 15px; color: var(--text-muted); text-align: center; }

    /* ─── MAIN ─── */
    .tt-main {
      margin-left: var(--sidebar-w); flex: 1;
      padding: 28px 28px 60px; min-height: 100vh;
    }
    .tt-section { display: none; }
    .tt-section.active { display: block; animation: secIn 0.18s ease; }
    @keyframes secIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ═══ TYPOGRAPHY ═══ */
    .tt-page-title { font-size: 31px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .tt-page-sub   { font-size: 17px; color: var(--text-muted); margin-bottom: 22px; }

    /* ═══ CARDS ═══ */
    .tt-card { background: var(--bg-card); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); overflow: hidden; }
    .tt-card + .tt-card { margin-top: 12px; }
    .tt-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    }
    .tt-card-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .tt-card-body  { padding: 16px; }

    /* ─── STAT CARDS ─── */
    .tt-stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 16px; }
    .tt-stat-card {
      background: var(--bg-card); border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); padding: 16px;
      position: relative; overflow: hidden;
    }
    .tt-stat-card::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 4px; height: 100%; background: var(--accent, var(--ios-blue));
      border-radius: 4px 0 0 4px;
    }
    .tt-stat-value { font-size: 33px; font-weight: 700; line-height: 1.1; }
    .tt-stat-label { font-size: 15px; color: var(--text-muted); margin-top: 4px; }

    /* ═══ GRIDS ═══ */
    .tt-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }

    /* ═══ BUTTONS ═══ */
    .tt-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      border: none; border-radius: var(--radius-sm); padding: 9px 18px;
      font-size: 17px; font-weight: 700; font-family: var(--font);
      cursor: pointer; white-space: nowrap; text-decoration: none;
      transition: filter var(--transition), transform 0.1s;
    }
    .tt-btn:hover  { filter: brightness(0.92); }
    .tt-btn:active { transform: scale(0.97); }
    .tt-btn--primary  { background: var(--accent);   color: var(--accent-text); }
    .tt-btn--danger   { background: var(--ios-red);  color: #fff; }
    .tt-btn--ghost    { background: var(--bg-input); color: var(--text-secondary); }
    .tt-btn--text     { background: transparent; color: var(--text-secondary); padding: 4px 8px; font-weight: 600; }
    .tt-btn--sm       { padding: 6px 12px; font-size: 15px; border-radius: 7px; }
    .tt-btn--icon     { padding: 7px 10px; border-radius: var(--radius-sm); }

    /* ═══ BADGES ═══ */
    .tt-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 15px; font-weight: 700; }
    .tt-badge--blue   { background: var(--accent-mid); color: var(--accent-dark); }
    .tt-badge--green  { background: rgba(52,199,89,0.14); color: #1a7a36; }
    .tt-badge--orange { background: rgba(255,149,0,0.15); color: #8a4d00; }
    .tt-badge--red    { background: rgba(255,59,48,0.13); color: #b02020; }
    .tt-badge--gray   { background: rgba(142,142,147,0.15); color: #555; }
    .tt-badge--purple { background: rgba(175,82,222,0.13); color: #7030a8; }

    /* ═══ INPUTS ═══ */
    .tt-input, .tt-textarea, .tt-select {
      width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 11px 14px; font-size: 18px; font-family: var(--font); font-weight: 700;
      color: var(--text-primary); background: var(--bg-card); outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .tt-input:focus, .tt-textarea:focus, .tt-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,214,0,0.28);
    }
    .tt-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
    .tt-form-group { margin-bottom: 14px; }
    .tt-form-group:last-child { margin-bottom: 0; }
    .tt-form-label { display: block; font-size: 16px; font-weight: 700; color: var(--text-secondary); margin-bottom: 5px; }
    .tt-form-row   { display: flex; gap: 10px; }
    .tt-form-row .tt-form-group { flex: 1; }
    .tt-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

    /* ═══ EMPTY STATE ═══ */
    .tt-empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; padding: 40px 20px;
      color: var(--text-muted); text-align: center;
    }
    .tt-empty-icon { font-size: 41px; }
    .tt-empty-text { font-size: 16px; line-height: 1.6; }

    /* ═══ TABLE ═══ */
    .tt-table { width: 100%; border-collapse: collapse; }
    .tt-table th, .tt-table td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 17px; }
    .tt-table th { font-weight: 700; color: var(--text-muted); font-size: 15px; text-transform: uppercase; letter-spacing: 0.4px; background: rgba(55,53,47,0.03); }
    .tt-table tbody tr:last-child td { border-bottom: none; }

    /* ═══ TOAST ═══ */
    .tt-toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(28,28,30,0.9); color: #fff;
      padding: 11px 26px; border-radius: 24px; font-size: 17px; font-weight: 700;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 9999; pointer-events: none; white-space: nowrap;
      backdrop-filter: blur(10px);
    }
    .tt-toast.show    { transform: translateX(-50%) translateY(0); }
    .tt-toast.success { background: rgba(52,199,89,0.92); }
    .tt-toast.danger  { background: rgba(255,59,48,0.92); }

    /* ═══ MODAL ═══ */
    .tt-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      backdrop-filter: blur(4px); animation: ovIn 0.15s ease;
    }
    @keyframes ovIn { from { opacity: 0; } to { opacity: 1; } }
    .tt-modal-box {
      background: var(--bg-card); border-radius: var(--radius-lg);
      width: min(92vw, 500px); max-height: 88vh; overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: mIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes mIn { from { opacity:0; transform: scale(0.94) translateY(12px); } to { opacity:1; transform: none; } }
    .tt-modal-box::-webkit-scrollbar { width: 5px; }
    .tt-modal-box::-webkit-scrollbar-thumb { background: var(--ios-gray3); border-radius: 3px; }
    .tt-modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg-card); z-index: 1;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .tt-modal-title { font-size: 20px; font-weight: 700; }
    .tt-modal-close {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: var(--bg-input); color: var(--text-secondary);
      font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background var(--transition); font-family: var(--font);
    }
    .tt-modal-close:hover { background: var(--ios-gray3); }
    .tt-modal-body { padding: 20px; }
    .tt-modal-foot {
      display: flex; gap: 8px; padding: 14px 20px;
      border-top: 1px solid var(--border);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      background: rgba(242,242,247,0.8);
    }
    .tt-modal-foot .tt-btn { flex: 1; padding: 10px; }

    /* ═══ DASHBOARD ═══ */
    .tt-dash-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 12px;
    }
    .tt-greeting     { font-size: 27px; font-weight: 700; margin-bottom: 3px; }
    .tt-date-str     { font-size: 17px; color: var(--text-muted); }
    .tt-dash-clock   { font-size: 45px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
    .tt-period-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .tt-period-pill  {
      display: flex; flex-direction: column; align-items: center;
      padding: 6px 10px; border-radius: 10px; background: var(--bg-page);
      min-width: 54px; gap: 2px; border: 1.5px solid var(--border);
      transition: all var(--transition);
    }
    .tt-period-pill.current { background: var(--accent); border-color: var(--accent); color: var(--accent-text); box-shadow: 0 2px 8px rgba(255,214,0,0.35); }
    .tt-period-pill.past    { opacity: 0.42; }
    .tt-period-num  { font-size: 16px; font-weight: 600; color: var(--text-muted); }
    .tt-period-pill.current .tt-period-num { color: rgba(255,255,255,0.75); }
    .tt-period-subj { font-size: 17px; font-weight: 700; }

    /* ─── DASHBOARD TIMETABLE GRID ─── */
    .tt-dash-tt { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .tt-dash-tt-cell {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px 3px; border-radius: var(--radius-sm);
      background: var(--bg-page); border: 1.5px solid var(--border);
      gap: 4px; text-align: center; transition: all var(--transition); min-height: 76px;
    }
    .tt-dash-tt-cell.current { background: var(--accent); border-color: var(--accent); color: var(--accent-text); box-shadow: 0 2px 8px rgba(255,214,0,0.35); }
    .tt-dash-tt-cell.past    { opacity: 0.38; }
    .tt-dash-tt-num  { font-size: 13px; font-weight: 600; color: var(--text-muted); line-height: 1; }
    .tt-dash-tt-cell.current .tt-dash-tt-num { color: rgba(26,26,26,0.6); }
    .tt-dash-tt-subj { font-size: 15px; font-weight: 700; line-height: 1.2; word-break: keep-all; }
    .tt-week-cols   { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }
    .tt-week-col    { background: var(--bg-page); border-radius: var(--radius-sm); padding: 8px; min-height: 60px; }
    .tt-week-col-lbl{ font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-align: center; }
    .tt-week-col.today .tt-week-col-lbl { color: var(--accent-dark); font-weight: 700; }
    .tt-ev-chip     { font-size: 14px; padding: 4px 8px; border-radius: 5px; margin-bottom: 3px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ─── MONTH NAV + CALENDAR ─── */
    .tt-month-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .tt-month-nav-cur { font-size:20px; font-weight:700; }
    .tt-mcal-head { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; margin-bottom:4px; }
    .tt-mcal-hdr  { text-align:center; font-size:14px; font-weight:700; color:var(--text-muted); padding:3px 0; }
    .tt-mcal-week { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; margin-bottom:3px; }
    .tt-mcal-day  {
      aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      border-radius:var(--radius-sm); border:1.5px solid transparent; cursor:pointer;
      background:var(--bg-page); gap:3px; transition:all 0.13s;
    }
    .tt-mcal-day:hover:not(.out-month):not(.holiday) { border-color:rgba(255,214,0,0.6); background:var(--accent-soft); }
    .tt-mcal-day.selected { border-color:var(--accent); background:var(--accent-mid); color:var(--accent-text); font-weight:700; }
    .tt-mcal-day.has-entry { background:rgba(52,199,89,0.14); }
    .tt-mcal-day.has-entry.selected { border-color:var(--ios-green); background:rgba(52,199,89,0.24); color:#186b32; }
    .tt-mcal-day.today:not(.selected) { border-color:var(--accent); }
    .tt-mcal-day.holiday { background:rgba(255,149,0,0.09); cursor:default; }
    .tt-mcal-day.holiday:hover { border-color:transparent; }
    .tt-mcal-day.out-month { background:transparent; border-color:transparent; cursor:default; }
    .tt-mcal-day.out-month:hover { background:transparent; border-color:transparent; }
    .tt-mcal-day-num  { font-size:16px; font-weight:600; line-height:1; }
    .tt-mcal-hol-txt  { font-size:12px; color:var(--ios-orange); font-weight:500; }
    .tt-mcal-dot      { width:6px; height:6px; border-radius:50%; background:var(--ios-green); }
    .tt-mcal-day.has-entry.selected .tt-mcal-dot { background:#186b32; }
    .tt-mcal-summary  { font-size:14px; color:var(--text-muted); margin-top:6px; text-align:right; }

    /* ─── DASH DATE PICKER ─── */
    .tt-dash-date-nav  { display:flex; align-items:center; gap:8px; position:relative; }
    .tt-dash-date-pill {
      display:inline-flex; align-items:center; gap:5px;
      padding:6px 14px; border-radius:20px; border:1.5px solid var(--border);
      background:var(--bg-card); font-size:17px; font-weight:700;
      cursor:pointer; user-select:none; box-shadow:var(--shadow-sm);
      transition:background var(--transition);
    }
    .tt-dash-date-pill:hover { background:var(--bg-page); }
    .tt-minical {
      position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
      background:var(--bg-card); border-radius:var(--radius-md);
      box-shadow:var(--shadow-lg); padding:14px 12px; z-index:500; min-width:264px;
      border:1px solid var(--border); animation:mIn 0.15s ease;
    }
    .tt-minical-hdr  { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .tt-minical-month{ font-size:17px; font-weight:700; }
    .tt-minical-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .tt-minical-wday { font-size:13px; font-weight:600; color:var(--text-muted); text-align:center; padding:4px 0; }
    .tt-minical-wday:first-child { color:var(--ios-red); }
    .tt-minical-wday:last-child  { color:var(--text-muted); }
    .tt-minical-day  {
      aspect-ratio:1; display:flex; align-items:center; justify-content:center;
      border-radius:50%; cursor:pointer; font-size:15px; font-weight:500;
      transition:background 0.12s;
    }
    .tt-minical-day:hover:not(.tm-today):not(.mc-sel) { background:var(--bg-page); }
    .tt-minical-day.tm-today { background:var(--accent); color:var(--accent-text) !important; }
    .tt-minical-day.mc-sel:not(.tm-today) { background:var(--accent-mid); color:var(--accent-dark); font-weight:700; }
    .tt-minical-day.other-m { opacity:0.38; }
    .tt-minical-day.day-sun { color:var(--ios-red); }
    .tt-minical-day.day-sat { color:var(--text-muted); }

    /* ═══ DASHBOARD MONTH CALENDAR ═══ */
    .tt-dash-cal-head { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
    .tt-dash-cal-wday { text-align:center; font-size:14px; font-weight:700; color:var(--text-muted); padding:5px 0; }

    }

</head>

<script>

// ═══════════════════════════════════════════════

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function genId() {
  try { return crypto.randomUUID(); }
  catch { return Math.random().toString(36).slice(2)+Date.now().toString(36); }
}
function todayKey() {
  const d=new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }
function dateToKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseKey(k)  { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(k,n) { const d=parseKey(k); d.setDate(d.getDate()+n); return dateToKey(d); }
function isToday(k)   { return k===todayKey(); }
function isWeekend(k) { const dw=parseKey(k).getDay(); return dw===0||dw===6; }
function fmtLong(k) {

}
function fmtShort(k) {
  const d=parseKey(k);
  return `${d.getMonth()+1}/${d.getDate()}(${DAY_FULL[d.getDay()]})`;
}
function fmtMonth(y,m) { return `${y}년 ${m}월`; }
function weekMon(k) {
  const d=parseKey(k), dw=d.getDay();
  d.setDate(d.getDate()+(dw===0?-6:1-dw));
  return dateToKey(d);
}
function getCurrentPeriodIdx() {
  const n=new Date(), hm=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
  return PERIOD_TIMES.findIndex(p=>hm>=p.s&&hm<p.e);
}
function isPastPeriod(i) {
  const n=new Date(), hm=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
  return hm>=PERIOD_TIMES[i].e;
}
function debounce(fn,ms) { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function findCurrentWeekIdx() {
  const t=todayKey();
  let i=WEEKS.findIndex(w=>w.dates.includes(t));
  if (i===-1) i=WEEKS.findIndex(w=>w.dates[0]>=t);
  return Math.max(0, i===-1?WEEKS.length-1:i);
}
function yearMonth(key) { return key.slice(0,7); } // 'YYYY-MM-DD' → 'YYYY-MM'
function prevMonthKey(ym) {
  const [y,m]=ym.split('-').map(Number);
  return m===1?`${y-1}-12`:`${y}-${pad(m-1)}`;
}
function nextMonthKey(ym) {
  const [y,m]=ym.split('-').map(Number);
  return m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;
}
function fmtYM(ym) { const [,m]=ym.split('-').map(Number); return `${m}월`; }
function fmtYMFull(ym) { const [y,m]=ym.split('-').map(Number); return `${y}년 ${m}월`; }

function buildMonthCal(ym, selDate, entries, goFn) {
  const [y,m]=ym.split('-').map(Number);
  const relWeeks=WEEKS.filter(w=>
    w.dates.some(d=>{ const p=d.split('-').map(Number); return p[0]===y&&p[1]===m; })
  );
  const hdr=['월','화','수','목','금'].map(h=>`<div class="tt-mcal-hdr">${h}</div>`).join('');
  if(!relWeeks.length) return `<div class="tt-mcal-head">${hdr}</div><div class="tt-mcal-summary">이 달에 수업일이 없습니다.</div>`;
  let totalDays=0, recordedDays=0;
  const rows=relWeeks.map(w=>{
    const cells=w.dates.map(d=>{
      const p=d.split('-').map(Number);
      if(p[0]!==y||p[1]!==m) return `<div class="tt-mcal-day out-month"></div>`;
      if(HOLIDAYS[d]) return `<div class="tt-mcal-day holiday" title="${HOLIDAYS[d]}"><div class="tt-mcal-day-num">${p[2]}</div><div class="tt-mcal-hol-txt">${HOLIDAYS[d]}</div></div>`;
      totalDays++;
      const has=!!(entries[d]?.trim());
      if(has) recordedDays++;
      const isSel=d===selDate, isT=isToday(d);
      return `<div class="tt-mcal-day${has?' has-entry':''}${isSel?' selected':''}${isT?' today':''}" onclick="${goFn}('${d}')">
        <div class="tt-mcal-day-num">${p[2]}</div>
        ${has?'<div class="tt-mcal-dot"></div>':''}
      </div>`;
    }).join('');
    return `<div class="tt-mcal-week">${cells}</div>`;
  }).join('');
  const summary=`<div class="tt-mcal-summary">총 수업일 ${totalDays}일 · 기록된 날 ${recordedDays}일</div>`;
  return `<div class="tt-mcal-head">${hdr}</div>${rows}${summary}`;
}

// Full 7-column (Sun-Sat) month calendar — used by att/lg sections
function buildFullMonthCal(ym, selDate, entries, goFn) {
  const [y,m]=ym.split('-').map(Number);
  const today=todayKey();
  const wdays=['일','월','화','수','목','금','토'].map(w=>`<div class="tt-dash-cal-wday">${w}</div>`).join('');
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const startDow=first.getDay(), days=last.getDate();
  let cells='';
  for(let i=0;i<startDow;i++){
    const d2=new Date(y,m-1,1-(startDow-i)), k=dateToKey(d2), dw=d2.getDay();
    cells+=`<div class="tt-dash-cal-day other-month${dw===0?' day-sun':dw===6?' day-sat':''}" onclick="${goFn}('${k}')"><div class="tt-dash-cal-num">${d2.getDate()}</div></div>`;
  }
  for(let day=1;day<=days;day++){
    const k=`${y}-${pad(m)}-${pad(day)}`, dw=new Date(y,m-1,day).getDay();
    const isHol=!!HOLIDAYS[k], isSel=k===selDate, isT=k===today;
    const hasEntry=!!(entries[k]?.trim());
    const holLabel=isHol?`<span class="tt-dash-cal-hol">${HOLIDAYS[k]}</span>`:'';
    let cls=`tt-dash-cal-day${dw===0?' day-sun':dw===6?' day-sat':''}${isHol?' holiday':''}${isSel?' selected':''}${isT?' today':''}`;
    cells+=`<div class="${cls}" onclick="${goFn}('${k}')">
      <div class="tt-dash-cal-num">${day}${holLabel}</div>
      ${hasEntry?'<div class="tt-dash-cal-dot dot-att"></div>':''}
    </div>`;
  }
  const trail=(startDow+days)%7;
  if(trail>0) for(let i=1;i<=7-trail;i++){
    const d2=new Date(y,m,i), k=dateToKey(d2), dw=d2.getDay();
    cells+=`<div class="tt-dash-cal-day other-month${dw===0?' day-sun':dw===6?' day-sat':''}" onclick="${goFn}('${k}')"><div class="tt-dash-cal-num">${i}</div></div>`;
  }
  const recCount=Object.keys(entries).filter(k=>k.startsWith(ym)&&entries[k]?.trim()).length;
  const summary=`<div class="tt-mcal-summary">기록된 날 ${recCount}일</div>`;
  return `<div class="tt-dash-cal-head">${wdays}</div><div class="tt-dash-cal-body">${cells}</div>${summary}`;
}

function load(key,fb) {
  try { const r=localStorage.getItem(key); return r?JSON.parse(r):fb; }
  catch { return fb; }
}
function save(key,data) {
  try { localStorage.setItem(key,JSON.stringify(data)); }
  catch { showToast('저장 공간이 부족합니다.','danger'); }
}

function buildDashTimetable(today) {
  if(isWeekend(today)) return `<div class="tt-empty" style="padding:20px"><div class="tt-empty-icon">🏖</div><div class="tt-empty-text">오늘은 주말입니다.</div></div>`;
  if(!Object.keys(ttData).length) return `<div style="font-size:16px;color:var(--text-muted);margin-bottom:10px">시간표 데이터 없음. timetable.html에서 입력하세요.</div><a href="timetable.html" target="_blank" class="tt-btn tt-btn--primary tt-btn--sm">시간표 편집기 열기</a>`;
  const cur=getCurrentPeriodIdx();
  const cells=PERIODS.map((_, i)=>{
    const cell=ttData[`${today}__${i}`];
    const subj=cell?(cell.content||'—'):'—';
    const isCurrent=cur===i, isPast=!isCurrent&&isPastPeriod(i);
    let bgStyle='';
    if(!isCurrent&&cell&&cell.color&&cell.color!=='#FFFFFF') bgStyle=`style="background:${cell.color};border-color:${cell.color}"`;
    const cls=`tt-dash-tt-cell${isCurrent?' current':isPast?' past':''}`;
    return `<div class="${cls}" ${bgStyle}><span class="tt-dash-tt-num">${i+1}교시</span><span class="tt-dash-tt-subj">${esc(subj)}</span></div>`;
  }).join('');
  return `<div class="tt-dash-tt">${cells}</div>`;
}

function getSortedTasks() {
  const t=todayKey();
  return [...duties.tasks].filter(x=>!x.done).sort((a,b)=>{
    if(!a.deadline&&!b.deadline) return 0;
    if(!a.deadline) return 1; if(!b.deadline) return -1;
    return a.deadline<b.deadline?-1:1;
  });
}

function buildDashDuties(tasks) {
  if(!tasks.length) return `<div class="tt-empty" style="padding:18px"><div class="tt-empty-icon">🎉</div><div class="tt-empty-text">예정된 업무 없음!</div></div>`;
  const t=todayKey();
  const items=tasks.map(tk=>{
    const ov=tk.deadline&&tk.deadline<t;
    const soon=!ov&&tk.deadline&&tk.deadline<=addDays(t,3);
    const bcls=ov?'tt-badge--red':soon?'tt-badge--orange':'tt-badge--gray';
    return `<div style="display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:var(--radius-sm);background:var(--bg-page)">
      <div style="flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${esc(tk.title)}</div>
      <span class="tt-badge ${bcls}" style="font-size:13px;padding:2px 7px;flex-shrink:0">${tk.deadline?fmtShort(tk.deadline):'기한없음'}</span>
    </div>`;
  }).join('');
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${items}</div>`;
}

function buildDashWeek(days) {
  const cols=days.map(day=>{
    const evs=getEventsOnDate(day);
    const d=parseKey(day);

    const evHtml=evs.slice(0,3).map(ev=>`<div class="tt-ev-chip ev-${ev.color}">${esc(ev.title)}</div>`).join('')+(evs.length>3?`<div style="font-size:13px;color:var(--text-muted)">외 ${evs.length-3}건</div>`:'');
    return `<div class="tt-week-col${isT?' today':''}"><div class="tt-week-col-lbl" ${isT?'style="color:var(--accent-dark)"':''}>${d.getDate()}일(${DAY_FULL[d.getDay()]})</div>${evHtml||`<div style="font-size:14px;color:var(--ios-gray3)">없음</div>`}</div>`;
  }).join('');
  return `<div class="tt-week-cols">${cols}</div>`;
}

// Shared mini-calendar builder: pickFn(dateKey), navFn(delta)
function buildCalHtml(y, m, pickFn, navFn) {
  const selDate=ui.dashDate||todayKey(), today=todayKey();
  const wdays=['일','월','화','수','목','금','토'].map(w=>`<div class="tt-minical-wday">${w}</div>`).join('');
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const startDow=first.getDay(), days=last.getDate();
  let cells='';
  for(let i=0;i<startDow;i++){
    const d2=new Date(y,m-1,1-(startDow-i)), k=dateToKey(d2), dw=d2.getDay();
    cells+=`<div class="tt-minical-day other-m${dw===0?' day-sun':dw===6?' day-sat':''}" onclick="${pickFn}('${k}')">${d2.getDate()}</div>`;
  }
  for(let day=1;day<=days;day++){
    const k=`${y}-${pad(m)}-${pad(day)}`, dw=new Date(y,m-1,day).getDay();
    const cls=(k===today?' tm-today':'')+(k===selDate&&k!==today?' mc-sel':'')+(dw===0?' day-sun':dw===6?' day-sat':'');
    cells+=`<div class="tt-minical-day${cls}" onclick="${pickFn}('${k}')">${day}</div>`;
  }
  const trail=(startDow+days)%7;
  if(trail>0) for(let i=1;i<=7-trail;i++){
    const d2=new Date(y,m,i), k=dateToKey(d2), dw=d2.getDay();
    cells+=`<div class="tt-minical-day other-m${dw===0?' day-sun':dw===6?' day-sat':''}" onclick="${pickFn}('${k}')">${i}</div>`;
  }
  return `
    <div class="tt-minical-hdr">
      <button class="tt-btn tt-btn--ghost tt-btn--icon" onclick="${navFn}(-1)">‹</button>
      <div class="tt-minical-month">${y}년 ${m}월</div>
      <button class="tt-btn tt-btn--ghost tt-btn--icon" onclick="${navFn}(1)">›</button>
    </div>
    <div class="tt-minical-grid">${wdays}${cells}</div>`;
}

// ─── DASHBOARD — MONTH CALENDAR ───
function buildDashMonthCal(ym, selDate) {
  const [y,m]=ym.split('-').map(Number);
  const today=todayKey();
  const wdays=['일','월','화','수','목','금','토'].map(w=>`<div class="tt-dash-cal-wday">${w}</div>`).join('');
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const startDow=first.getDay(), days=last.getDate();
  let cells='';
  for(let i=0;i<startDow;i++) {
    const d2=new Date(y,m-1,1-(startDow-i)), k=dateToKey(d2), dw=d2.getDay();
    cells+=`<div class="tt-dash-cal-day other-month${dw===0?' day-sun':dw===6?' day-sat':''}" onclick="dashPickDate('${k}')"><div class="tt-dash-cal-num">${d2.getDate()}</div></div>`;
  }
  for(let day=1;day<=days;day++) {
    const k=`${y}-${pad(m)}-${pad(day)}`, dw=new Date(y,m-1,day).getDay();
    const isHol=!!HOLIDAYS[k];
    const isSel=k===selDate, isT=k===today;
    const hasAtt=!!(att.entries[k]?.trim());
    const hasDuty=duties.tasks.some(t=>t.deadline===k&&!t.done);
    const hasEv=sched.events.some(ev=>ev.date===k||(ev.endDate&&ev.date<=k&&ev.endDate>=k));
    const dots=(hasAtt?`<div class="tt-dash-cal-dot dot-att"></div>`:'')+
               (hasDuty?`<div class="tt-dash-cal-dot dot-duty"></div>`:'')+
               (hasEv?`<div class="tt-dash-cal-dot dot-ev"></div>`:'');
    const holLabel=isHol?`<span class="tt-dash-cal-hol">${HOLIDAYS[k]}</span>`:'';
    let cls=`tt-dash-cal-day${dw===0?' day-sun':dw===6?' day-sat':''}${isHol?' holiday':''}${isSel?' selected':''}${isT?' today':''}`;
    cells+=`<div class="${cls}" onclick="dashPickDate('${k}')">
      <div class="tt-dash-cal-num">${day}${holLabel}</div>
      ${dots?`<div class="tt-dash-cal-dots">${dots}</div>`:''}
    </div>`;
  }
  const trail=(startDow+days)%7;
  if(trail>0) for(let i=1;i<=7-trail;i++){
    const d2=new Date(y,m,i), k=dateToKey(d2), dw=d2.getDay();
    cells+=`<div class="tt-dash-cal-day other-month${dw===0?' day-sun':dw===6?' day-sat':''}" onclick="dashPickDate('${k}')"><div class="tt-dash-cal-num">${i}</div></div>`;
  }
  const legend=`<div class="tt-dash-cal-legend">
    <span><div class="tt-dash-cal-dot dot-att"></div> 출결</span>
    <span><div class="tt-dash-cal-dot dot-duty"></div> 업무</span>
    <span><div class="tt-dash-cal-dot dot-ev"></div> 일정</span>
  </div>`;
  return `<div class="tt-dash-cal-head">${wdays}</div><div class="tt-dash-cal-body">${cells}</div>${legend}`;
}

function buildTTGrid(week) {
  const hCells=week.dates.map(date=>{
    const d=parseKey(date), dow=DAY_SHORT[d.getDay()-1]||'?';
    const hol=HOLIDAYS[date];
    const isT=isToday(date);
    return `<th class="${hol?'hol':''}${isT?' cur':''}">${dow}(${d.getMonth()+1}/${d.getDate()})${hol?`<br><span style="font-size:12px;font-weight:400">${hol}</span>`:''}${isT?'<br><span style="font-size:12px;font-weight:400;color:rgba(255,255,255,0.8)">오늘</span>':''}</th>`;
  }).join('');
  const rows=PERIODS.map((_, i)=>{
    const cells=week.dates.map(date=>{
      const cell=ttData[`${date}__${i}`];
      const bg=cell&&cell.color?cell.color:(HOLIDAYS[date]?'#FFF9C4':'#fff');
      return `<td class="${HOLIDAYS[date]?'hol':''}" style="background:${bg}">${esc(cell?cell.content||'':'')}</td>`;
    }).join('');
    return `<tr><td class="tt-tt-period">${PERIODS[i]}</td>${cells}</tr>`;
  }).join('');
  return `<table class="tt-tt-grid"><thead><tr><th>교시</th>${hCells}</tr></thead><tbody>${rows}</tbody></table>`;
}

  view==='list'?renderDList():renderDWeekly();

function renderDList() {
  const today=todayKey();
  const sorted=[...duties.tasks].sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    if(!a.deadline&&!b.deadline) return 0;
    if(!a.deadline) return 1; if(!b.deadline) return -1;
    return a.deadline<b.deadline?-1:1;
  });
  const el=document.getElementById('duties-inner');
  if(!sorted.length){el.innerHTML=`<div class="tt-empty"><div class="tt-empty-icon">🎉</div><div class="tt-empty-text">업무 없음! + 업무 추가로 시작하세요.</div></div>`;return;}
  el.innerHTML=sorted.map(t=>{
    const ov=!t.done&&t.deadline&&t.deadline<today;
    const soon=!ov&&!t.done&&t.deadline&&t.deadline<=addDays(today,3);
    const dlBadge=t.deadline?`<span class="tt-badge ${ov?'tt-badge--red':soon?'tt-badge--orange':'tt-badge--gray'}">${fmtShort(t.deadline)}</span>`:'';
    const priBadge=t.priority&&t.priority!=='normal'?`<span class="tt-badge ${t.priority==='high'?'tt-badge--red':'tt-badge--gray'}">${PRI_LABEL[t.priority]}</span>`:'';
    return `<div class="tt-task-card${t.done?' done':''}">
      <div class="tt-task-check" onclick="toggleDone('${t.id}')">${t.done?'<span style="color:#fff;font-size:15px">✓</span>':''}</div>
      <div class="tt-task-body">
        <div class="tt-task-title">${esc(t.title)}</div>
        ${t.detail?`<div class="tt-task-detail">${esc(t.detail)}</div>`:''}
        <div class="tt-task-meta">${dlBadge}${priBadge}</div>
      </div>
      <div class="tt-task-actions">
        <button class="tt-btn tt-btn--ghost tt-btn--icon tt-btn--sm" onclick="openDutyModal('${t.id}')">✏️</button>
        <button class="tt-btn tt-btn--ghost tt-btn--icon tt-btn--sm" onclick="delDuty('${t.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

  const mon=ui.dutiesWeek||weekMon(todayKey());
  const days=Array.from({length:5},(_,i)=>addDays(mon,i));
  const today=todayKey();
  const cols=days.map((day,di)=>{

      <button class="tt-btn tt-btn--ghost" onclick="closeModal()">취소</button>
      <button class="tt-btn tt-btn--primary" onclick="saveDutyModal(${id?`'${id}'`:'null'})">저장</button>
    </div>`);
  setTimeout(()=>document.getElementById('dm-t')?.focus(),60);
}
function saveDutyModal(id) {
  const title=(document.getElementById('dm-t')?.value||'').trim();
  const detail=(document.getElementById('dm-d')?.value||'').trim();
  const dl=document.getElementById('dm-dl')?.value||null;
  const pri=document.getElementById('dm-p')?.value||'normal';
  if(!title) return showToast('제목을 입력해주세요.','danger');
  if(id&&id!=='null') {
    duties={...duties,tasks:duties.tasks.map(t=>t.id===id?{...t,title,detail,deadline:dl,priority:pri}:t)};
  } else {
    duties={...duties,tasks:[...duties.tasks,{id:genId(),title,detail,deadline:dl,priority:pri,done:false,createdAt:new Date().toISOString()}]};
  }
  saveDu(); closeModal(); renderDuties(); showToast('저장되었습니다.','success');
}
function delDutyModal(id) {
  if(!confirm('삭제할까요?')) return;
  duties={...duties,tasks:duties.tasks.filter(t=>t.id!==id)};
  saveDu(); closeModal(); renderDuties(); showToast('삭제되었습니다.');
}

// ═══════════════════════════════════════════════
//  SCHEDULE
// ═══════════════════════════════════════════════
function renderSched() {
  const y=ui.schedY||new Date().getFullYear();
  const m=ui.schedM||new Date().getMonth()+1;
  document.getElementById('sched-root').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div><div class="tt-page-title">🗓 일정표</div><div class="tt-page-sub">월간 일정 관리</div></div>
      <button class="tt-btn tt-btn--primary" onclick="openEvModal(null,'${y}-${pad(m)}-01')">+ 일정 추가</button>
    </div>
    <div class="tt-card">
      <div class="tt-card-header">
        <div class="tt-cal-nav">
          <button class="tt-btn tt-btn--ghost tt-btn--icon" onclick="schedNav(-1)">‹</button>
          <div class="tt-cal-month">${fmtMonth(y,m)}</div>
          <button class="tt-btn tt-btn--ghost tt-btn--icon" onclick="schedNav(1)">›</button>
        </div>
        <button class="tt-btn tt-btn--ghost tt-btn--sm" onclick="schedToday()">이번 달</button>
      </div>
      <div class="tt-card-body">
        <div class="tt-cal-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="tt-cal-grid">${buildCalGrid(y,m)}</div>
      </div>
    </div>`;
}

function buildCalGrid(y,m) {
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const startDow=first.getDay(), days=last.getDate();
  const today=todayKey();
  let cells='';
  for(let i=0;i<startDow;i++){const d=new Date(y,m-1,1-(startDow-i));cells+=buildCalDay(dateToKey(d),true);}
  for(let d=1;d<=days;d++){cells+=buildCalDay(`${y}-${pad(m)}-${pad(d)}`,false);}
  const trail=(startDow+days)%7;
  if(trail>0) for(let i=1;i<=7-trail;i++){const d=new Date(y,m,i);cells+=buildCalDay(dateToKey(d),true);}
  return cells;
}

function buildCalDay(key,other) {
  const d=parseKey(key), dw=d.getDay(), num=d.getDate();
  const evs=getEventsOnDate(key);
  const isT=isToday(key);
  const evHtml=evs.slice(0,3).map(ev=>`<div class="tt-ev-chip ev-${ev.color}" onclick="event.stopPropagation();openEvModal('${ev.id}','${key}')">${esc(ev.title)}</div>`).join('')+(evs.length>3?`<div style="font-size:13px;color:var(--text-muted)">외 ${evs.length-3}건</div>`:'');
  const numHtml=isT?`<div class="tt-cal-day-num"><span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--accent);color:var(--accent-text);border-radius:50%">${num}</span></div>`:`<div class="tt-cal-day-num">${num}</div>`;
  return `<div class="tt-cal-day${other?' other-month':''}${isT?' today':''}${dw===0?' day-sun':''}${dw===6?' day-sat':''}" onclick="openEvModal(null,'${key}')">
    ${numHtml}${evHtml}
  </div>`;
}

function getEventsOnDate(key) {
  return sched.events.filter(ev=>{
    if(!ev.endDate) return ev.date===key;
    return key>=ev.date&&key<=ev.endDate;
  });
}

function schedNav(d) {
  let y=ui.schedY||new Date().getFullYear(), m=ui.schedM||new Date().getMonth()+1;
  m+=d;
  if(m<1){y--;m=12;}if(m>12){y++;m=1;}
  ui.schedY=y;ui.schedM=m;saveUI();renderSched();
}
function schedToday() { ui.schedY=new Date().getFullYear();ui.schedM=new Date().getMonth()+1;saveUI();renderSched(); }

function openEvModal(id,prefill) {
  const ev=id?sched.events.find(e=>e.id===id):null;
  const swatches=EVENT_COLORS.map(c=>
    `<div data-color="${c}" class="ev-swatch ev-${c}" onclick="pickEvColor('${c}',this)"
      style="width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid ${(ev?.color||'blue')===c?'#333':'transparent'};flex-shrink:0"></div>`
  ).join('');
  openModal(`
    <div class="tt-modal-head">
      <div class="tt-modal-title">${ev?'일정 편집':'+ 일정 추가'}</div>
      <button class="tt-modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="tt-modal-body">
      <div class="tt-form-group"><label class="tt-form-label">일정 제목 *</label>
        <input id="em-t" class="tt-input" maxlength="80" value="${esc(ev?.title||'')}"></div>
      <div class="tt-form-row">
        <div class="tt-form-group"><label class="tt-form-label">시작일 *</label>
          <input id="em-d" class="tt-input" type="date" value="${ev?.date||prefill||todayKey()}"></div>
        <div class="tt-form-group"><label class="tt-form-label">종료일 (선택)</label>
          <input id="em-e" class="tt-input" type="date" value="${ev?.endDate||''}"></div>
      </div>
      <div class="tt-form-group"><label class="tt-form-label">색상</label>
        <div id="evSwatches" style="display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">${swatches}</div>
        <input type="hidden" id="em-c" value="${ev?.color||'blue'}">
      </div>
      <div class="tt-form-group"><label class="tt-form-label">메모</label>
        <textarea id="em-n" class="tt-textarea" style="min-height:60px">${esc(ev?.note||'')}</textarea></div>
    </div>
    <div class="tt-modal-foot">
      ${ev?`<button class="tt-btn tt-btn--danger" onclick="delEvModal('${ev.id}')">삭제</button>`:''}
      <button class="tt-btn tt-btn--ghost" onclick="closeModal()">취소</button>
      <button class="tt-btn tt-btn--primary" onclick="saveEvModal(${id?`'${id}'`:'null'})">저장</button>
    </div>`);
  setTimeout(()=>document.getElementById('em-t')?.focus(),60);
}
function pickEvColor(c,el) {
  document.getElementById('em-c').value=c;
  document.querySelectorAll('#evSwatches .ev-swatch').forEach(d=>{d.style.border=`3px solid ${d.dataset.color===c?'#333':'transparent'}`;});
}
function saveEvModal(id) {
  const title=(document.getElementById('em-t')?.value||'').trim();
  const date=document.getElementById('em-d')?.value;
  const endDate=document.getElementById('em-e')?.value||null;
  const color=document.getElementById('em-c')?.value||'blue';
  const note=(document.getElementById('em-n')?.value||'').trim();
  if(!title) return showToast('제목을 입력해주세요.','danger');
  if(!date)  return showToast('시작일을 입력해주세요.','danger');
  if(id&&id!=='null'){
    sched={...sched,events:sched.events.map(e=>e.id===id?{...e,title,date,endDate,color,note}:e)};
  } else {
    sched={...sched,events:[...sched.events,{id:genId(),title,date,endDate,color,note}]};
  }
  saveSc(); closeModal(); renderSched(); showToast('저장되었습니다.','success');
}
function delEvModal(id) {
  if(!confirm('삭제할까요?')) return;
  sched={...sched,events:sched.events.filter(e=>e.id!==id)};
  saveSc(); closeModal(); renderSched(); showToast('삭제되었습니다.');
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
function init() {
  loadAll();
  tickClock(); setInterval(tickClock,30000);
  renderSidebarPhoto();
  renderSidebarDateNav();
  navigateTo(ui.sec||'dashboard');
}

init();
</script>
