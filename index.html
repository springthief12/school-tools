<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>솔개 학급 도구</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  font-weight: 700;
  background: #F7F6F3;
  color: #37352F;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.container { max-width: 500px; width: 100%; text-align: center; }
.title { font-size: 2.5rem; font-weight: 700; color: #37352F; margin-bottom: 8px; }
.subtitle { color: #9B9A97; font-size: 1rem; margin-bottom: 52px; }

.cards { display: flex; flex-direction: column; gap: 14px; }
.card {
  display: block; text-decoration: none;
  background: #fff; border: 1.5px solid rgba(55,53,47,0.12); border-radius: 14px;
  padding: 26px 30px; text-align: left; transition: all 0.18s;
  box-shadow: 0 1px 3px rgba(55,53,47,0.07);
}
.card:hover {
  border-color: rgba(55,53,47,0.28); background: #fefefe;
  transform: translateY(-2px); box-shadow: 0 6px 22px rgba(55,53,47,0.1);
}
.card-icon { font-size: 2.2rem; margin-bottom: 10px; display: block; }
.card-title { font-size: 1.15rem; font-weight: 700; color: #37352F; margin-bottom: 5px; }
.card-desc { font-size: 0.88rem; color: #9B9A97; line-height: 1.65; font-weight: 700; }

.footer { margin-top: 44px; color: #C7C7CC; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="container">
  <div class="title">솔개 📚</div>
  <div class="subtitle">학급 운영 도구 모음</div>

  <div class="cards">
    <a class="card" href="teacher-tool.html">
      <span class="card-icon">🍎</span>
      <div class="card-title">담임 교사 도구</div>
      <div class="card-desc">출석부, 생활지도 일지, 업무 관리, 일정표를 한 곳에. 오늘 할 일을 대시보드로 한눈에.</div>
    </a>
    <a class="card" href="timetable.html">
      <span class="card-icon">🗓️</span>
      <div class="card-title">학급 시간표</div>
      <div class="card-desc">2026년 2학기(8월~1월) 시간표 관리. 셀 색상 설정, 기본 시간표 일괄 적용, 월별 접기.</div>
    </a>
    <a class="card" href="vote.html">
      <span class="card-icon">🗳️</span>
      <div class="card-title">블라인드 투표</div>
      <div class="card-desc">후보 등록 → 비밀 투표 → 투표지 개봉 애니메이션으로 긴장감 있는 개표 진행.</div>
    </a>
  </div>

  <div class="footer">springthief12 · GitHub Pages</div>
</div>
</body>
</html>
